{% extends "base.html" %}
{% block start %}

<div class="container mt-5">
  <form class="col-6 mx-auto card p-3 shadow-lg" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <h2>Add Recipe</h2>
    <hr>

    <div class="mb-3">
      <label class="form-label">Recipe Name</label>
      <input name="name" required type="text" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Recipe Description</label>
      <textarea name="description" class="form-control" required></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Recipe Image</label>
      <input name="receipe_image" type="file" class="form-control">
    </div>

    <button type="submit" class="btn btn-success">Add Recipe</button>
  </form>
  <hr>
  <div class="mt-5">
    <div class="mx-auto col-6">
      <form>
      <div class="mb-3">
        <label class="form-label">Search Recipe</label>
        <input name="Search" type="text" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary">Search</button>
      </form>
    </div>
 
    <table class="table mt-5">
      <thead>
        <tr>
          <th scope="col">S.N.</th>
          <th scope="col">Recipe Name</th>
          <th scope="col">Recipe Description</th>
          <th scope="col">Image</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody>
        {% for i in receipe %}
        <tr>
          <th scope="row">{{forloop.counter}}</th>
          <td>{{i.name}}</td>
          <td>{{i.description}}</td>
          <td>
            <img src="/media/{{i.receipe_image}}" style="height: 200px">
          </td>
          <td>
            <a href="/delete-receipe/{{i.id}}" button class="btn btn-danger">Delete</button></a>
            <a href="/update-receipe/{{i.id}}" button class="btn btn-success mt-5">Edit</button></a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  {% endblock %}
